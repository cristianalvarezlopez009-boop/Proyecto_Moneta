<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #F5F7FE;
    --bg-2: #FFFFFF;
    --card: #EDF1FD;
    --line: #DCE3F7;
    --ink: #10173A;
    --ink-soft: #4C5480;
    --ink-faint: #8791BB;

    --blue: #2F5BFF;
    --blue-deep: #1E3FCC;
    --blue-ink: #F2F5FF;
    --blue-pale: #E7ECFE;

    --teal: #12B4A0;
    --teal-bg: #E4F8F5;
    --alert: #D94F4F;
    --alert-bg: #FBEAEA;

    --shadow: rgba(47, 91, 255, 0.14);

    --font-display: 'Space Grotesk', sans-serif;
    --font-ui: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0F26;
      --bg-2: #131834;
      --card: #171D3E;
      --line: #2A3160;
      --ink: #EEF1FE;
      --ink-soft: #ABB3E0;
      --ink-faint: #6C74A3;
      --blue: #5B7FFF;
      --blue-deep: #7C9AFF;
      --blue-ink: #0E1230;
      --blue-pale: #1B2350;
      --teal: #3FD6C0;
      --teal-bg: #0E2A26;
      --alert: #F08080;
      --alert-bg: #351A1A;
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0B0F26; --bg-2: #131834; --card: #171D3E; --line: #2A3160;
    --ink: #EEF1FE; --ink-soft: #ABB3E0; --ink-faint: #6C74A3;
    --blue: #5B7FFF; --blue-deep: #7C9AFF; --blue-ink: #0E1230; --blue-pale: #1B2350;
    --teal: #3FD6C0; --teal-bg: #0E2A26; --alert: #F08080; --alert-bg: #351A1A;
    --shadow: rgba(0, 0, 0, 0.45);
  }

  *, *::before, *::after {
    box-sizing: inherit;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .download-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 32px var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .app-brand h1 {
    font-family: var(--font-display);
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  .card-title {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--ink);
  }

  .card-subtitle {
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  /* Animación de la flecha */
  .arrow-icon {
    width: 40px;
    height: 40px;
    color: var(--blue);
    margin-bottom: 16px;
    animation: bounce 1.8s infinite;
  }

  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(8px); }
    60% { transform: translateY(4px); }
  }

  .download-btn {
    width: 100%;
    background-color: var(--blue);
    color: #FFFFFF;
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    padding: 16px 24px;
    border-radius: 14px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  .download-btn:hover {
    background-color: var(--blue-deep);
    transform: translateY(-1px);
  }

  .download-btn:active {
    transform: translateY(0);
  }

  .footer-logo {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .footer-logo svg {
    width: 52px;
    height: 52px;
  }

  .footer-text {
    font-size: 0.8rem;
    color: var(--ink-faint);
    font-weight: 500;
  }
</style>
</head>
<body>

  <main class="download-card">
    
    <div class="app-brand">
      <!-- Logo Moneta SVG -->
      <svg width="40" height="40" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3D6BFF"/>
            <stop offset="1" stop-color="#0E1533"/>
          </linearGradient>
          <linearGradient id="greenGrad" x1="0" y1="0" x2="16" y2="10" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7CE8B4"/>
            <stop offset="1" stop-color="#12B4A0"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
        <g transform="translate(36,9) rotate(18)">
          <rect width="16" height="10" rx="2.4" fill="url(#greenGrad)"/>
        </g>
        <rect x="13" y="22" width="38" height="28" rx="7" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
        <circle cx="45" cy="36" r="2.6" fill="#FFFFFF"/>
        <path d="M20 46 L20 30 L32 40 L44 30 L44 46" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Moneta</h1>
    </div>

    <h2 class="card-title">Descarga la aplicación</h2>
    <p class="card-subtitle">Toma el control total de tus gastos e ingresos personales desde tu dispositivo.</p>

    <!-- Flecha indicadora animada -->
    <svg class="arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>

    <!-- AQUÍ PEGAS EL ENLACE DE TU APLICACIÓN -->
    <a href="AQUÍ_VA_TU_ENLACE_DE_DESCARGA" class="download-btn">
      Descargar APK / App
    </a>

    <!-- Logo e identificador inferior -->
    <div class="footer-logo">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad2" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3D6BFF"/>
            <stop offset="1" stop-color="#0E1533"/>
          </linearGradient>
          <linearGradient id="greenGrad2" x1="0" y1="0" x2="16" y2="10" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7CE8B4"/>
            <stop offset="1" stop-color="#12B4A0"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#bgGrad2)"/>
        <g transform="translate(36,9) rotate(18)">
          <rect width="16" height="10" rx="2.4" fill="url(#greenGrad2)"/>
        </g>
        <rect x="13" y="22" width="38" height="28" rx="7" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
        <circle cx="45" cy="36" r="2.6" fill="#FFFFFF"/>
        <path d="M20 46 L20 30 L32 40 L44 30 L44 46" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="footer-text">Moneta App</span>
    </div>

  </main>

</body>
</html>
